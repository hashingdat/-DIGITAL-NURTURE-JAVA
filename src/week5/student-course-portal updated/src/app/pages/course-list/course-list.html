<div class="container">
  <h2>Course Catalog</h2>

  <!-- Loading state handled via async pipe -->
  <p *ngIf="isLoading$ | async">Loading courses...</p>

  <div class="course-grid">
    <div *ngFor="let course of (courses$ | async)" class="course-card">
      <h3>{{ course.name || course.title }}</h3>
      <p><strong>Code:</strong> {{ course.code }}</p>
      <p *ngIf="course.category"><strong>Category:</strong> {{ course.category }}</p>
      <a [routerLink]="['/courses', course.id]" class="btn-details">View Details</a>
    </div>
  </div>
</div>
