<div class="form-container">
  <h2>Student Course Enrollment Request</h2>

  <!-- Success Message -->
  <div *ngIf="submitted" class="success-alert">
    Enrollment request submitted successfully!
  </div>

  <form #enrollForm="ngForm" (ngSubmit)="onSubmit(enrollForm)">

    <!-- 1. Student Name -->
    <div class="form-group">
      <label for="studentName">Student Name *</label>
      <input
        type="text"
        id="studentName"
        name="studentName"
        [(ngModel)]="formData.studentName"
        required
        minlength="3"
        #nameCtrl="ngModel"
        class="form-control"
      />
      <!-- Contextual Error Messages -->
      <div *ngIf="nameCtrl.touched && nameCtrl.invalid" class="error-msg">
        <span *ngIf="nameCtrl.errors?.['required']">Name is required.</span>
        <span *ngIf="nameCtrl.errors?.['minlength']">Name must be at least 3 characters.</span>
      </div>
    </div>

    <!-- 2. Student Email -->
    <div class="form-group">
      <label for="studentEmail">Student Email *</label>
      <input
        type="email"
        id="studentEmail"
        name="studentEmail"
        [(ngModel)]="formData.studentEmail"
        required
        email
        #emailCtrl="ngModel"
        class="form-control"
      />
      <div *ngIf="emailCtrl.touched && emailCtrl.invalid" class="error-msg">
        <span *ngIf="emailCtrl.errors?.['required']">Email is required.</span>
        <span *ngIf="emailCtrl.errors?.['email']">Please enter a valid email address.</span>
      </div>
    </div>

    <!-- 3. Course ID -->
    <div class="form-group">
      <label for="courseId">Course ID *</label>
      <input
        type="number"
        id="courseId"
        name="courseId"
        [(ngModel)]="formData.courseId"
        required
        #courseCtrl="ngModel"
        class="form-control"
      />
      <div *ngIf="courseCtrl.touched && courseCtrl.invalid" class="error-msg">
        <span *ngIf="courseCtrl.errors?.['required']">Course ID is required.</span>
      </div>
    </div>

    <!-- 4. Preferred Semester -->
    <div class="form-group">
      <label for="preferredSemester">Preferred Semester</label>
      <select
        id="preferredSemester"
        name="preferredSemester"
        [(ngModel)]="formData.preferredSemester"
        class="form-control"
      >
        <option value="Odd">Odd</option>
        <option value="Even">Even</option>
      </select>
    </div>

    <!-- 5. Agree to Terms Checkbox -->
    <div class="form-group checkbox-group">
      <label>
        <input
          type="checkbox"
          name="agreeToTerms"
          [(ngModel)]="formData.agreeToTerms"
          required
          #termsCtrl="ngModel"
        />
        I agree to the terms and conditions *
      </label>
      <div *ngIf="termsCtrl.touched && termsCtrl.invalid" class="error-msg">
        <span>You must agree to the terms before submitting.</span>
      </div>
    </div>

    <!-- Buttons -->
    <div class="button-group">
      <button type="submit" [disabled]="enrollForm.invalid" class="btn btn-primary">
        Submit
      </button>
      <button type="button" (click)="onReset(enrollForm)" class="btn btn-secondary">
        Reset
      </button>
    </div>

  </form>
</div>
